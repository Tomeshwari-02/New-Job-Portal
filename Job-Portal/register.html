<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Character encoding (supports most languages) -->
    <meta charset="UTF-8" />

    <!-- Title shown on browser tab -->
    <title>Registration</title>

    <!-- Bootstrap CSS for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<!-- Container class gives proper spacing, mt-5 = margin-top -->
<body class="container mt-5">

    <!-- Heading of the page -->
    <h2>Registration</h2>

    <!-- Form starts here (POST method used to send data securely) -->
    <form method="POST">

        <!-- Dropdown to select role (Employer or Worker) -->
        <select name="role" class="form-select mb-3">
            <option value="employer">Employer</option>
            <option value="worker">Worker</option>
        </select>

        <!-- Username input field -->
        <input 
            name="username" 
            placeholder="Username" 
            class="form-control mb-3" 
            required 
        />

        <!-- Password input field (hidden characters) -->
        <input 
            type="password" 
            name="password" 
            placeholder="Password" 
            class="form-control mb-3" 
            required 
        />

        <!-- Submit button -->
        <button class="btn btn-primary">Register</button>

    </form>
</body>
</html>
